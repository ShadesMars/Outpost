- type: entity
  parent: MarkerBase
  id: RMCTriggerTeleporter
  name: teleporter
  suffix: RMC14
  components:
  - type: Sprite
    sprite: _RMC14/Markers/landmarks.rsi
    layers:
    - state: trigger
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 1500
        hard: false
        mask:
        - MobMask
        - MobLayer
        - GhostImpassable
        layer:
        - MobMask
        - MobLayer
        - GhostImpassable
  - type: RMCTeleporter

- type: entity
  parent: RMCTriggerTeleporter
  id: RMCTriggerTeleporterDamage50
  suffix: RMC14, 50 Blunt on Teleport
  components:
  - type: RMCTeleporter
    teleportDamage:
      types:
        Blunt: 50

- type: entity
  parent: MarkerBase
  id: RMCTriggerTeleporterViewer
  abstract: true
  name: teleporter viewer
  components:
  - type: Sprite
    sprite: _RMC14/Markers/landmarks.rsi
    layers:
    - state: projector
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-4.49,-4.49,4.49,4.49"
        density: 1500
        hard: false
        mask:
        - MobMask
        - MobLayer
        - GhostImpassable
        layer:
        - MobMask
        - MobLayer
        - GhostImpassable
  - type: RMCTeleporterViewer

- type: entity
  parent: RMCTriggerTeleporterViewer
  id: RMCTriggerTeleporterViewer9x9
  name: teleporter viewer
  suffix: RMC14, 9x9

- type: entity
  parent: RMCTriggerTeleporterViewer
  id: RMCTriggerTeleporterViewer5x5
